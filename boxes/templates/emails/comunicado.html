<!doctype html>

      <tr><td style="background:#23313f;padding:22px 28px;">
        <p style="margin:0;color:#bf98cb;font-size:22px;">{{ titulo }}</p>

      <tr><td style="padding:28px;font-size:15px;line-height:1.6;">{{ texto|linebreaksbr }}</td></tr>
      <tr><td style="background:#965ba5;padding:14px 28px;color:#ffffff;font-size:12px;">{{ unidade }} · Guarda tudo</td></tr>
    </table>
